# Boca Town Square. Schema: packages/config/src/town.ts (CLAUDE.md §10).
# Sources are added only once verified live (CLAUDE.md §14).
slug: boca-raton
name: Boca Raton
short_name: Boca
state: FL
census_id: '1207300' # Census place GEOID for the city of Boca Raton (verified 2026-10-15 via the Census Geocoder)
county: Palm Beach
timezone: America/New_York
site_name: Boca Town Square
# The owner's logo (docs/brand/boca-town-square-logo.webp); the header uses its wordmark.
logo: { src: /brand/boca-raton/wordmark.webp, width: 936, height: 121 }
# The logo's illustration beside the homepage greeting, and its left half (from the left palm to
# just before the big right palm) as the browser and Home Screen icons.
hero_art: { src: /brand/boca-raton/hero.webp, width: 1221, height: 407 }
app_icon: /brand/boca-raton
domain: bocatownsquare.com
extra_domains: []
tier: large
newsletter_send_time: '06:30'
same_name_elsewhere: [] # towns to guard against in wrong-town checks
agencies:
  - City of Boca Raton
  - Boca Raton Police Services
  - Boca Raton Fire Rescue
sources:
  # Verified 2026-10-15. Council and public meetings: the city's CivicPlus calendar (iCal export).
  # Agenda documents themselves are on Granicus, which robots.txt blocks, so they're not fetched.
  - kind: agenda
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '29' }
  # Verified 2026-10-16: the city's event calendars on the same CivicPlus site (iCal feeds,
  # allowed by robots.txt). Community events, the city's museums, nature center, parks and venues;
  # classes and league calendars (aquatics, athletics, fitness, tennis, golf) are left out, and
  # the Libraries calendar is empty (the library posts its events elsewhere).
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '58' } # Community Events
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '45' } # Events & Activities
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '48' } # Children's Science Explorium
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '47' } # Gumbo Limbo Nature Center
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '27' } # Mizner Park Amphitheater
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '32' } # Willow Theatre at Sugar Sand Park
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '49' } # Sugar Sand Park Community Center
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '50' } # Boca Raton Community Center
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '59' } # Public Art Boca
  - kind: events
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: calendar, catId: '60' } # Wildflower in Bloom Events
  # City media releases (CivicPlus News Flash, all categories).
  - kind: city_news
    platform: civicplus
    url: https://www.myboca.us/
    options: { module: newsflash, catId: All-newsflash.xml }
  # Verified 2026-10-15: Florida DBPR licensee files (contractors, electricians), filtered to the city.
  - kind: business_filings
    platform: fl-dbpr
    options: { city: BOCA RATON }
  # Verified 2026-10-15: DBPR Hotels and Restaurants food service licensees, district 2 (Palm
  # Beach, Broward, Martin), filtered to the location city. Feeds the directory (M6).
  - kind: business_filings
    platform: fl-dbpr
    options: { city: BOCA RATON, files: [hrfood2.csv] }
  # Verified 2026-10-16: DBPR new food service establishments approved this fiscal year
  # (statewide newfood.csv, with approval dates), filtered to the location city.
  - kind: business_filings
    platform: fl-dbpr
    options: { city: BOCA RATON, files: [newfood.csv] }
  # Verified 2026-10-16: DBPR food service inspections this fiscal year, district 2 (Palm Beach,
  # Broward, Martin), refreshed weekly; filtered to the location city. Weekly roundup (Tier 3
  # when it names a closure or an administrative complaint).
  - kind: inspections
    platform: fl-dbpr
    options: { city: BOCA RATON, files: [2fdinspi.csv] }
  # Verified 2026-10-17: Division of Alcoholic Beverages and Tobacco daily activity (statewide
  # daily.csv in the same allowed extracts folder; one day per file, so it runs daily). Only new
  # liquor licenses, by trade name: they join new food service licenses in a weekly roundup.
  - kind: business_filings
    platform: fl-dbpr
    schedule: 1d
    options: { city: BOCA RATON, files: [daily.csv] }
  # Verified 2026-10-17: Palm Beach County Property Appraiser sales (ArcGIS Server table
  # PAO.PROPINFO; robots.txt 404, no rules), at a real price, not confidential. City limits by
  # parcel number: county parcel numbers start with the municipality code (06 = Boca Raton);
  # MUNICIPALITY is the mailing city, and two-thirds of "BOCA RATON" sales are unincorporated.
  # Only these columns are requested: never owners' names or mailing addresses. Deeds appear
  # about two weeks after a sale, so each run re-reads three weeks. Weekly roundup (Tier 1).
  - kind: property_sales
    platform: arcgis
    url: https://maps.co.palm-beach.fl.us/arcgis/rest/services/OpenData/Tables/MapServer/1
    options:
      dateField: SALE_DATE
      idField: SALEKEY
      title: '{SITE_ADDR_STR}'
      where: "PARCEL_NUMBER LIKE '06%' AND PRICE >= 1000 AND (CONFID_FLG IS NULL OR CONFID_FLG <> 'Y')"
      outFields:
        [
          SALEKEY,
          PARCEL_NUMBER,
          SITE_ADDR_STR,
          SUBDIV_NAME,
          SALE_DATE,
          PRICE,
          INSTRUMENT,
          PROPERTY_USE,
          TOTAL_MARKET,
        ]
      fields:
        SITE_ADDR_STR: Address
        PRICE: Price
        SALE_DATE: Sale date
        INSTRUMENT: Deed
        PROPERTY_USE: Use
        SUBDIV_NAME: Subdivision
        PARCEL_NUMBER: Parcel
      lagDays: 21
      type: sale
  # Verified 2026-10-17: Greater Boca Raton Beach & Park District news (Drupal RSS; robots.txt
  # allows /rss.xml). An elected special district: parks, beaches, Sugar Sand Park.
  - kind: city_news
    platform: feed
    url: https://www.mybocaparks.org/rss.xml
    options: { pages: true }
  # Verified 2026-10-15: Florida Division of Corporations daily filings (new businesses).
  - kind: business_filings
    platform: fl-sunbiz
    options: { city: BOCA RATON }
  # Verified 2026-10-15: NWS Miami zone FLZ168, Coastal Palm Beach County (names Boca Raton).
  # The point is verified too: api.weather.gov/points names it "Boca Raton, FL" (grid MFL 111,77).
  # Beach tiles (D-M4b-3, sources approved 2026-10-16, verified live): the NWS Miami surf zone
  # forecast's FLZ168 segment, NOAA CO-OPS station 8722670 Lake Worth Pier (the ocean station the
  # NWS surf forecast itself uses; the Boca Raton station is in the lagoon), and the EPA UV index
  # for ZIP 33432.
  - kind: weather
    platform: nws
    zone: FLZ168
    point: '26.3587,-80.0831'
    beach: { surf_office: MFL, tide_station: '8722670', uv_zip: '33432' }
pricing:
  # Featured spots #1, #2 and #3 a month; a business's first spot is free for 30 days.
  featured_usd: [19, 12, 7]
  enhanced_usd: 39
