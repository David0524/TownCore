name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: towncore
          POSTGRES_PASSWORD: towncore
          POSTGRES_DB: towncore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U towncore"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://towncore:towncore@localhost:5432/towncore
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations match schema
        run: |
          pnpm db:check
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: pnpm db:migrate
      - run: pnpm towns:sync
      - name: Seed fictional fixture towns (CI only)
        run: pnpm --filter @towncore/web seed:fixtures
      - run: pnpm test
      - run: pnpm build
      - name: Worker boots from the build
        run: pnpm --filter @towncore/worker smoke
      - name: Install Playwright Chromium
        run: pnpm --filter @towncore/web exec playwright install --with-deps chromium
      - name: Site end-to-end tests
        run: pnpm --filter @towncore/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
